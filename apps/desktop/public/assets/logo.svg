<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Musical note design inspired by reference -->
  <defs>
    <linearGradient id="noteGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7C5AC2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6B4DB1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5940A0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer curved shape - left side of note -->
  <path d="M 180 80 
           Q 120 90 100 150
           Q 90 200 100 250
           Q 110 300 140 340
           Q 160 370 180 390
           Q 170 410 150 420
           Q 120 440 90 430
           Q 60 420 50 390
           Q 30 340 40 280
           Q 50 220 80 170
           Q 110 120 160 90
           Q 200 70 240 80
           L 240 100
           Q 210 90 180 80 Z"
        fill="url(#noteGradient)"/>
  
  <!-- Inner curved shape - completes the note -->
  <path d="M 240 80
           L 260 80
           Q 300 85 330 100
           Q 370 125 400 170
           Q 430 220 440 280
           Q 450 340 430 390
           Q 420 420 390 430
           Q 360 440 330 420
           Q 310 410 300 390
           Q 320 370 340 340
           Q 370 300 380 250
           Q 390 200 370 150
           Q 350 90 300 80
           L 280 75
           L 260 100
           L 260 380
           Q 260 400 250 410
           Q 240 420 220 410
           Q 200 400 190 380
           L 240 360
           L 240 100
           L 240 80 Z"
        fill="url(#noteGradient)"/>
  
  <!-- Top decorative curve -->
  <path d="M 220 100
           Q 200 80 180 75
           Q 160 72 150 85
           Q 145 95 155 105
           Q 170 115 190 110
           Q 210 105 220 100 Z"
        fill="url(#noteGradient)"
        opacity="0.8"/>
  
  <!-- Bottom decorative curve -->
  <path d="M 280 380
           Q 300 400 320 405
           Q 340 408 350 395
           Q 355 385 345 375
           Q 330 365 310 370
           Q 290 375 280 380 Z"
        fill="url(#noteGradient)"
        opacity="0.8"/>
</svg>
