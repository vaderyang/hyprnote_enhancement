<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions for Modern Look -->
  <defs>
    <linearGradient id="cardGradient" x1="256" y1="160" x2="256" y2="440">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="pinGradient" x1="256" y1="70" x2="256" y2="220">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="graphGradient" x1="180" y1="260" x2="332" y2="340">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4C6FFF" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="245" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="12"/>
  
  <!-- Note Card Base with Shadow -->
  <g filter="url(#shadow)">
    <rect x="110" y="170" width="292" height="260" rx="24" fill="url(#cardGradient)" stroke="#4C6FFF" stroke-width="16"/>
  </g>
  
  <!-- Pin forming letter 'P' -->
  <g id="pin-p">
    <!-- Pin head (circular) with bold outline -->
    <circle cx="256" cy="95" r="38" fill="url(#pinGradient)" stroke="#D97706" stroke-width="10"/>
    <!-- Pin shaft going down (wider) -->
    <rect x="238" y="133" width="36" height="80" rx="12" fill="url(#pinGradient)"/>
    <!-- Pin point (more pronounced) -->
    <path d="M 256 213 L 238 233 L 274 233 Z" fill="#D97706"/>
  </g>
  
  <!-- Knowledge Graph (Bold Version) -->
  <g id="knowledge-graph">
    <!-- Connection lines (draw first, thicker) -->
    <line x1="175" y1="285" x2="256" y2="330" stroke="url(#graphGradient)" stroke-width="14" stroke-linecap="round"/>
    <line x1="256" y1="330" x2="337" y2="285" stroke="url(#graphGradient)" stroke-width="14" stroke-linecap="round"/>
    <line x1="175" y1="285" x2="337" y2="285" stroke="url(#graphGradient)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Nodes (larger) -->
    <!-- Left dot -->
    <circle cx="175" cy="285" r="22" fill="#FFFFFF" stroke="#4C6FFF" stroke-width="10"/>
    <!-- Center dot -->
    <circle cx="256" cy="330" r="22" fill="#FFFFFF" stroke="#4C6FFF" stroke-width="10"/>
    <!-- Right dot -->
    <circle cx="337" cy="285" r="22" fill="#FFFFFF" stroke="#4C6FFF" stroke-width="10"/>
  </g>
  
  <!-- Accent line on card top (decorative element) -->
  <rect x="130" y="190" width="252" height="8" rx="4" fill="#4C6FFF" opacity="0.3"/>
</svg>
