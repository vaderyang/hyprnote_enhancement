<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle for better visibility on different backgrounds -->
  <circle cx="256" cy="256" r="240" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="4"/>
  
  <!-- Note Card Base -->
  <rect x="120" y="180" width="272" height="240" rx="16" fill="#FFFFFF" stroke="#4C6FFF" stroke-width="8"/>
  
  <!-- Pin forming letter 'P' -->
  <g id="pin-p">
    <!-- Pin head (circular) -->
    <circle cx="256" cy="100" r="32" fill="#F59E0B" stroke="#D97706" stroke-width="4"/>
    <!-- Pin shaft going down -->
    <rect x="248" y="132" width="16" height="72" rx="8" fill="#F59E0B"/>
    <!-- Pin point -->
    <path d="M 256 204 L 248 220 L 264 220 Z" fill="#D97706"/>
  </g>
  
  <!-- Knowledge Graph Dots (3 connected dots forming a network inside the card) -->
  <g id="knowledge-graph">
    <!-- Left dot -->
    <circle cx="180" cy="280" r="16" fill="#4C6FFF"/>
    <!-- Center dot -->
    <circle cx="256" cy="320" r="16" fill="#4C6FFF"/>
    <!-- Right dot -->
    <circle cx="332" cy="280" r="16" fill="#4C6FFF"/>
    
    <!-- Connection lines -->
    <line x1="180" y1="280" x2="256" y2="320" stroke="#4C6FFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="320" x2="332" y2="280" stroke="#4C6FFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="180" y1="280" x2="332" y2="280" stroke="#4C6FFF" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Subtle shadow effect on card -->
  <rect x="124" y="184" width="264" height="232" rx="14" fill="none" stroke="#94A3B8" stroke-width="2" opacity="0.3"/>
</svg>
